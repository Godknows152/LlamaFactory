#######################################################################################
# Qwen3-VL 图像还原工具调用 SFT 训练配置
# 单机4卡 DDP 训练 (每卡80GB)
# 使用方法: bash train_restore_4gpu.sh
# 或手动: torchrun --nproc_per_node=4 src/train.py examples/train_lora/qwen3vl_lora_sft_restore_4gpu.yaml
#######################################################################################

### Model Configuration
model_name_or_path: /home/LXJ/Python_Projects/ViGoRL/Qwen_Model/Qwen3-VL-8B-Instruct_for_sft
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### Training Method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### Dataset Configuration
dataset: restoration_sft_train
template: qwen3_vl_nothink
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4
overwrite_cache: true

### Evaluation Dataset
eval_dataset: restoration_sft_val

### Output Configuration
output_dir: saves/qwen3-vl-8b-restore/lora/sft-4gpu
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: false
save_only_model: true

### SwanLab Integration (Experiment Tracking)
use_swanlab: true  # 使用 SwanLab 记录实验
swanlab_project: LLaMA_Factory
swanlab_run_name: SFT_4月26日0时26分

### Training Parameters (4-GPU DDP Optimized, 80GB per GPU)
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true

### Evaluation Configuration
eval_strategy: steps
eval_steps: 100
eval_accumulation_steps: 8
metric_for_best_model: eval_loss
greater_is_better: false
save_strategy: steps
load_best_model_at_end: true

### Optimization & Checkpointing
save_total_limit: 3
max_steps: -1
seed: 42
resume_from_checkpoint: null

### Hardware & Logging
optim: paged_adamw_32bit
max_grad_norm: 1.0
gradient_checkpointing: true
enable_liger_kernel: true  # 使用 Liger Kernel 加速训练，节省显存
